[package]
name = "ffcore"
version = "0.5.8"
edition.workspace = true
license-file.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
thiserror.workspace = true
blake3.workspace = true
rusqlite.workspace = true
ignore.workspace = true
grep-regex = "0.1"
grep-searcher = "0.1"
grep-matcher = "0.1"
similar = "2"
# Local git only (status/diff/commit/conflicts) — no network transports, so
# default features (https/ssh) are off to avoid linking Homebrew's OpenSSL +
# libssh2. That external link otherwise crashes the app on machines without
# them and clashes with ad-hoc code signing (Team-ID mismatch).
git2 = { version = "0.19", default-features = false }
sysinfo = "0.32"

[dev-dependencies]
tempfile = "3"
