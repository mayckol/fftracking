[workspace]
resolver = "2"
members = ["crates/ffcore", "crates/ffcli", "src-tauri"]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
thiserror = "2"
blake3 = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
ignore = "0.4"
