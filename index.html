<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <title>fftracking</title>
    <!-- Dark base before any CSS/JS loads, so new windows (e.g. the merge editor)
         never flash white while the bundle parses. -->
    <style>
      html, body, #root { height: 100%; margin: 0; background: #0a0c10; }
      #ff-boot {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        color: #5d6b7a; font-family: system-ui, sans-serif; font-size: 12.5px; letter-spacing: 0.04em;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="ff-boot">Loading…</div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
