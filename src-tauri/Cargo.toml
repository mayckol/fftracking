[package]
name = "fftracking"
version = "1.1.6"
edition.workspace = true
license-file.workspace = true
default-run = "fftracking"

[lib]
name = "fftracking_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ffcore = { path = "../crates/ffcore" }
mcr-core = { path = "../../mcr/crates/mcr-core" }
mcr-session = { path = "../../mcr/crates/mcr-session" }
# `unstable` unlocks the multiwebview API (Window::add_child) used to embed MCR's
# diff view as a child webview over the Git pane (src/mcr_embed.rs).
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api", "unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-os = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
serde.workspace = true
serde_json.workspace = true
portable-pty = "0.8"
base64 = "0.22"
trash = "5"
redis = "0.27"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
